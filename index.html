<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Crypto Miner</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #00ff00;
    text-align: center;
    padding: 50px;
  }
  #hashes {
    font-size: 2em;
    margin: 20px 0;
  }
  #progress {
    width: 80%;
    background: #333;
    border-radius: 10px;
    margin: 20px auto;
    height: 30px;
  }
  #progressBar {
    width: 0%;
    height: 100%;
    background: #00ff00;
    border-radius: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 1em;
    margin-top: 20px;
    cursor: pointer;
    background: #222;
    color: #00ff00;
    border: 2px solid #00ff00;
    border-radius: 5px;
  }
  button:hover {
    background: #00ff00;
    color: #000;
  }
</style>
</head>
<body>

<h1>🚀 Crypto Miner</h1>
<p>Mining Bitcoin... almost done!</p>

<div id="hashes">Hashes: 0</div>

<div id="progress">
  <div id="progressBar"></div>
</div>

<button onclick="startMining()">Start Mining</button>

<script>
let hashes = 0;
let mining = false;

function startMining() {
  if (mining) return;
  mining = true;
  document.querySelector('button').disabled = true;
  
  let interval = setInterval(() => {
    // Random hash generation
    let newHashes = Math.floor(Math.random() * 1000);
    hashes += newHashes;
    document.getElementById('hashes').innerText = `Hashes: ${hashes.toLocaleString()}`;
    
    // Update progress bar
    let progress = Math.min((hashes / 50000) * 100, 100);
    document.getElementById('progressBar').style.width = progress + '%';
    
    if (progress >= 100) {
      clearInterval(interval);
      document.querySelector('button').innerText = 'Mining Complete ✅';
      alert('Congratulations! You mined 0.001 BTC (fake)!');
    }
  }, 200);
}
</script>

</body>
</html>
